name: One-time layout fix
on:
  push:
    paths: ['.github/workflows/fix-layout.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move gta6/* to the repo root and restore dot-files
        run: |
          git config user.name "layout-fix"
          git config user.email "layout-fix@users.noreply.github.com"
          if [ -d gta6 ]; then
            git rm -q -f README.md || true
            for f in gta6/*; do git mv -f "$f" .; done
          fi
          mkdir -p .github
          cat > .github/news-state.json <<'JSON'
          {
            "newswireQueryUrl": "https://graph.rockstargames.com/?origin=https://www.rockstargames.com&operationName=NewswireList&variables=%7B%22tagIdHash%22%3Anull%2C%22page%22%3A1%2C%22metaUrl%22%3A%22%2Fnewswire%22%2C%22limit%22%3A20%2C%22locale%22%3A%22en_us%22%7D&extensions=%7B%22persistedQuery%22%3A%7B%22version%22%3A1%2C%22sha256Hash%22%3A%227ec00215aecc70de257b0719a1dfcfa84fe57fdc7bf5c10ec2e8f377defede58%22%7D%7D"
          }
          JSON
          printf 'node_modules/\n.DS_Store\n' > .gitignore
          git add -A .github/news-state.json .gitignore
          if git diff --cached --quiet; then echo "nothing to do"; exit 0; fi
          git commit -m "Move site files from gta6/ to repo root; add news-state.json and .gitignore"
          git push
