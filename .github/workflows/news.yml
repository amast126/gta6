name: Update news feed

on:
  schedule:
    - cron: "*/30 * * * *"   # about every 30 minutes (GitHub may delay scheduled runs a few minutes)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write            # needed to commit news.json (also set Settings → Actions → General → Read and write)

concurrency:
  group: news-feed
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Fetch news
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # optional: push alerts to your phone via ntfy.sh
        run: node scripts/fetch-news.mjs

      - name: Commit news.json if it changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json .github/news-state.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "news: update feed ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push
          fi
